name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies (heavy ML libraries are stubbed in tests/conftest.py)
        run: pip install pytest numpy pandas
      - name: Byte-compile
        run: python -m compileall -q voice_cloner
      - name: Run tests
        run: pytest -q
      - name: Notebook is valid JSON
        run: python -c "import json; json.load(open('notebooks/Voice_Cloner_Colab.ipynb'))"
